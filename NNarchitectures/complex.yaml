  - type: Dropout
    params: {p: 0.5}
  - type: ELU
    params: {}
  - type: Linear
    params: {in_features: 32, out_features: 64}
  - type: Dropout
    params: {p: 0.5}
  - type: ELU
    params: {}
  - type: Linear
    params: {in_features: 64, out_features: 32}
  - type: Dropout
    params: {p: 0.5}
  - type: ELU
    params: {}
  - type: Linear
    params: {in_features: 32, out_features: 1}
  - type: Sigmoid
    params: {}
